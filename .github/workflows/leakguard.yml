name: LeakGuard Resource Lifetime Scan

on:
  push:
    branches: [ main, master, doctron ]
  pull_request:
    branches: [ main, master, doctron ]

jobs:
  leakguard-scan:
    name: LeakGuard Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run LeakGuard Scanner
        uses: ./integrations/github_action
        with:
          target: '.'
          fail_on: 'error'
          severity: 'info'
          confidence: 'low'
          format: 'sarif'
          sarif_file: 'leakguard-results.sarif'
          upload_sarif: 'true'

      # Notify LeakGuard backend to trigger PR Review Bot (CodeRabbit-style)
      # Only runs on pull_request events with a configured backend URL
      - name: Notify LeakGuard PR Review Bot
        if: github.event_name == 'pull_request' && env.LEAKGUARD_API_URL != ''
        continue-on-error: true  # Never block CI if backend is unreachable
        env:
          LEAKGUARD_API_URL: ${{ secrets.LEAKGUARD_API_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
        run: |
          echo "Notifying LeakGuard PR Review Bot at $LEAKGUARD_API_URL"
          curl -s -X POST "$LEAKGUARD_API_URL/api/v1/github/prs/trigger-review?repo_full_name=${{ github.repository }}&pr_number=${{ github.event.pull_request.number }}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: $GITHUB_WEBHOOK_SECRET" \
            --max-time 10 || true
          echo "LeakGuard PR Review Bot notification sent"
