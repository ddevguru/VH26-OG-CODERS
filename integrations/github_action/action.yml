name: 'LeakGuard Resource Lifetime Scanner'
description: 'AST and Control-Flow Based Static Resource Lifetime Analysis for Python in CI/CD'
author: 'LeakGuard Team'

inputs:
  target:
    description: 'Path to repository directory or single Python source file'
    required: false
    default: '.'
  severity:
    description: 'Minimum severity threshold filter (info, warning, error, critical)'
    required: false
    default: 'info'
  confidence:
    description: 'Minimum confidence threshold filter (low, medium, high)'
    required: false
    default: 'low'
  fail_on:
    description: 'CI failure blocking threshold (error, warning, critical, info, none)'
    required: false
    default: 'error'
  changed_only:
    description: 'Scan only git changed files in pull request'
    required: false
    default: 'false'
  baseline:
    description: 'Path to baseline JSON file for suppressing known issues'
    required: false
    default: ''
  format:
    description: 'Report output format (text, json, sarif)'
    required: false
    default: 'sarif'
  sarif_file:
    description: 'File path to save SARIF output report'
    required: false
    default: 'leakguard-results.sarif'
  upload_sarif:
    description: 'Upload SARIF results to GitHub Code Security tab'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install LeakGuard
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run LeakGuard Analysis
      shell: bash
      run: |
        ARGS="--format ${{ inputs.format }} --fail-on ${{ inputs.fail_on }} --severity ${{ inputs.severity }} --confidence ${{ inputs.confidence }}"
        if [ -n "${{ inputs.sarif_file }}" ]; then
          ARGS="$ARGS --out ${{ inputs.sarif_file }}"
        fi
        if [ "${{ inputs.changed_only }}" = "true" ]; then
          ARGS="$ARGS --changed-only"
        fi
        if [ -n "${{ inputs.baseline }}" ]; then
          ARGS="$ARGS --baseline ${{ inputs.baseline }}"
        fi
        leakguard scan "${{ inputs.target }}" $ARGS

    - name: Upload SARIF report to GitHub Code Security
      if: inputs.upload_sarif == 'true' && inputs.format == 'sarif' && always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif_file }}
